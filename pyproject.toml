[project]
name = "sentiment-classifier"
version = "0.1.2"
description = "A sentiment classifier agent built with agents7."
authors = [{ name = "Carlos Pinto", email = "carlospinto4p@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    # A tagged framework release. Every package installed into one
    # environment must name the same tag (see the framework's
    # docs/agent-packages.md).
    "agents7 @ git+https://github.com/carlospinto4p/agents7@v9.25.9",
]

[project.entry-points."agents7.agents"]
sentiment_classifier = "sentiment_classifier:CONFIG_PATH"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.13.0"]

[tool.hatch.metadata]
# hatchling refuses a git URL dependency without this.
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
